<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Roblox Radar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0d0f14; --card: #181b22; --card2: #20242d; --line: #262b35;
    --text: #f2f4f8; --dim: #8b93a3; --accent: #ffb23e; --up: #3ddc84; --down: #ff6b6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  h1 { font-size: 26px; margin: 0; letter-spacing: -.3px; }
  .sub { color: var(--dim); font-size: 13px; margin-top: 2px; }
  .sub b { color: var(--accent); font-variant-numeric: tabular-nums; }
  .upd { color: var(--dim); font-size: 12px; text-align: right; white-space: nowrap; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--up); margin-right: 5px; }
  .dot.old { background: var(--down); }
  input { width: 100%; background: var(--card); border: 1px solid transparent; color: var(--text);
    font: inherit; font-size: 16px; padding: 13px 16px; border-radius: 14px; outline: none; }
  input:focus { border-color: var(--accent); }
  input::placeholder { color: var(--dim); }
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; margin: 0 -16px; scrollbar-width: none;
    position: sticky; top: 0; background: var(--bg); z-index: 5; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; padding: 9px 14px; border-radius: 999px; background: var(--card); color: var(--dim);
    font-weight: 600; font-size: 14px; border: 0; cursor: pointer; }
  .tab.on { background: var(--accent); color: #1a1200; }
  .note { color: var(--dim); font-size: 13px; margin: 2px 2px 10px; }
  .row { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 14px;
    padding: 10px 14px 10px 10px; margin-bottom: 8px; cursor: pointer; min-height: 64px; }
  .row:active { background: var(--card2); }
  .rank { width: 20px; text-align: center; color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; flex: none; }
  .ico { width: 44px; height: 44px; border-radius: 10px; background: var(--card2); flex: none; object-fit: cover; }
  .mid { flex: 1; min-width: 0; }
  .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { color: var(--dim); font-size: 12.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .right { text-align: right; flex: none; }
  .num { font-weight: 700; font-variant-numeric: tabular-nums; }
  .pct { font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .pct.up { color: var(--up); } .pct.down { color: var(--down); } .pct.na { color: var(--dim); font-weight: 400; }
  .hot { border: 1px solid var(--accent); }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 6px;
    background: var(--accent); color: #1a1200; margin-right: 6px; vertical-align: 1px; }
  .theme { padding: 14px 16px; }
  .theme .name { font-size: 16px; }
  .kids { margin: -2px 0 12px 14px; padding-left: 10px; border-left: 2px solid var(--line); }
  .empty { color: var(--dim); text-align: center; padding: 36px 16px; }
  .shade { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 20; display: none; }
  .shade.on { display: block; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--card); max-height: 88vh;
    overflow-y: auto; border-radius: 22px 22px 0 0; padding: 10px 16px calc(20px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .22s ease; max-width: 640px; margin: 0 auto; }
  .sheet.on { transform: none; }
  .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 14px; }
  .shead { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
  .shead .ico { width: 64px; height: 64px; border-radius: 14px; }
  .shead .t { font-size: 18px; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: var(--card2); border-radius: 12px; padding: 10px 12px; min-width: 0; }
  .stat .l { color: var(--dim); font-size: 12px; }
  .stat .v { font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .stat .v small { font-weight: 400; font-size: 12px; color: var(--dim); }
  .stat.wide { grid-column: 1 / -1; }
  .spark { width: 100%; height: 90px; display: block; margin-top: 6px; }
  .descr { color: var(--dim); font-size: 13px; white-space: pre-line; margin: 12px 2px; overflow-wrap: anywhere; }
  .btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 14px; font: inherit; font-weight: 700;
    background: var(--accent); color: #1a1200; cursor: pointer; margin-top: 12px; }
  .hint { color: var(--dim); font-size: 12px; margin: 8px 2px 0; }
  @media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }
  h2 { font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: .6px; margin: 16px 2px 8px; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Roblox Radar</h1>
      <div class="sub" id="sub">Завантажую…</div>
    </div>
    <div class="upd" id="upd"></div>
  </header>
  <input id="q" type="search" placeholder="Пошук гри…" autocomplete="off">
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
</div>
<div class="shade" id="shade"></div>
<div class="sheet" id="sheet"></div>
<script>
const DATA_URL = "https://raw.githubusercontent.com/quwwix/roblox-radar/state/data.json";
const tg = window.Telegram && Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor("#0d0f14"); tg.setBackgroundColor("#0d0f14"); } catch (e) {} }

const TABS = [
  ["grow", "🚀 Ростуть"], ["new", "🆕 Нові хіти"], ["themes", "🔥 Теми"], ["kw", "🔎 Слова"], ["top", "🏆 Топ"], ["watch", "👀 Стежу"],
];
let data = null, tab = "grow", openTheme = null;
try { tab = localStorage.getItem("tab") || "grow"; } catch (e) {}

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const k = (n) => n == null ? "—" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "K" : String(n);
const ageS = (d) => d == null ? "" : d < 1 ? "сьогодні" : d < 365 ? d + " дн." : (d / 365).toFixed(1) + " р.";

function pctEl(p, isNew) {
  if (p == null) return el("div", "pct na", isNew ? "нова в чартах" : "");
  return el("div", "pct " + (p >= 0 ? "up" : "down"), (p >= 0 ? "+" : "") + p + "%");
}

function openGame(g) {
  if (!g.place) return;
  const url = "https://www.roblox.com/games/" + g.place;
  if (tg && tg.openLink) tg.openLink(url); else window.open(url, "_blank");
}

function gameRow(g, i, opts = {}) {
  const r = el("div", "row" + (opts.hot ? " hot" : ""));
  if (i != null) r.append(el("div", "rank", i + 1));
  const img = el("img", "ico");
  img.loading = "lazy"; img.alt = "";
  if (g.icon) img.src = g.icon;
  r.append(img);
  const mid = el("div", "mid");
  const name = el("div", "name");
  if (opts.badge) name.append(el("span", "badge", opts.badge));
  name.append(document.createTextNode(g.name));
  mid.append(name);
  const meta = [];
  if (g.age != null) meta.push("грі " + ageS(g.age));
  if (g.gain) meta.push("+" + k(g.gain) + " гравців");
  mid.append(el("div", "meta", meta.join(" · ")));
  r.append(mid);
  const right = el("div", "right");
  right.append(el("div", "num", k(g.players)), pctEl(g.pct, opts.growTab));
  r.append(right);
  r.onclick = () => openSheet(g);
  return r;
}

// ---------- картка гри з характеристиками
const num = (n) => n == null ? "—" : n >= 1e9 ? (n / 1e9).toFixed(1) + " млрд" : n >= 1e6 ? (n / 1e6).toFixed(1) + " млн" : n >= 1e3 ? (n / 1e3).toFixed(1) + " тис" : String(n);
const sessS = (m) => m == null ? "—" : m >= 60 ? Math.floor(m / 60) + " год " + Math.round(m % 60) + " хв" : m + " хв";

function stat(label, value, sub, wide) {
  const s = el("div", "stat" + (wide ? " wide" : ""));
  s.append(el("div", "l", label));
  const v = el("div", "v", value);
  if (sub) { v.append(" "); v.append(el("small", null, sub)); }
  s.append(v);
  return s;
}

function spark(hist) {
  const NS = "http://www.w3.org/2000/svg", W = 300, Hh = 90, pad = 4;
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${Hh}`); svg.setAttribute("class", "spark"); svg.setAttribute("preserveAspectRatio", "none");
  const maxT = Math.max(...hist.map((p) => p[0])), minT = Math.min(...hist.map((p) => p[0]));
  const maxP = Math.max(...hist.map((p) => p[1]), 1);
  const x = (t) => maxT === minT ? W : pad + (W - 2 * pad) * (maxT - t) / (maxT - minT);
  const y = (p) => Hh - pad - (Hh - 2 * pad) * p / maxP;
  const pts = hist.map((p) => x(p[0]).toFixed(1) + "," + y(p[1]).toFixed(1));
  const area = document.createElementNS(NS, "polygon");
  area.setAttribute("points", `${x(maxT)},${Hh} ` + pts.join(" ") + ` ${x(minT)},${Hh}`);
  area.setAttribute("fill", "rgba(255,178,62,.15)");
  const line = document.createElementNS(NS, "polyline");
  line.setAttribute("points", pts.join(" ")); line.setAttribute("fill", "none");
  line.setAttribute("stroke", "#ffb23e"); line.setAttribute("stroke-width", "2"); line.setAttribute("vector-effect", "non-scaling-stroke");
  svg.append(area, line);
  return svg;
}

function closeSheet() { $("sheet").classList.remove("on"); $("shade").classList.remove("on"); }

function openSheet(g) {
  const d = (data.details || {})[g.id] || {};
  const s = $("sheet"); s.textContent = ""; s.scrollTop = 0;
  s.append(el("div", "grab"));
  const head = el("div", "shead");
  const img = el("img", "ico"); img.alt = ""; if (g.icon) img.src = g.icon;
  const tt = el("div", "mid");
  tt.append(el("div", "t", g.name), el("div", "meta", [d.creator, d.genre].filter(Boolean).join(" · ")));
  head.append(img, tt); s.append(head);

  const grid = el("div", "grid");
  grid.append(stat("Онлайн зараз", k(g.players)));
  grid.append(stat("Зміна за добу", g.pct == null ? "—" : (g.pct >= 0 ? "+" : "") + g.pct + "%"));
  grid.append(stat("Середня сесія", d.session == null ? "—" : "≈ " + sessS(d.session), d.session == null ? "рахую…" : "оцінка"));
  grid.append(stat("Візитів за добу", d.visits_day == null ? "—" : "≈ " + num(d.visits_day)));
  grid.append(stat("Лайки", d.like == null ? "—" : d.like + "%", d.votes ? num(d.votes) + " голосів" : ""));
  grid.append(stat("Усього візитів", num(d.visits)));
  grid.append(stat("В обраному", num(d.favs)));
  grid.append(stat("Вік гри", g.age == null ? "—" : ageS(g.age), d.created ? "з " + d.created.split("-").reverse().join(".") : ""));
  grid.append(stat("Оновлено", d.upd_days == null ? "—" : d.upd_days < 1 ? "сьогодні" : Math.round(d.upd_days) + " дн. тому"));
  grid.append(stat("Гравців на сервері", d.max == null ? "—" : "до " + d.max));
  if (d.hist && d.hist.length >= 3) {
    const span = Math.max(...d.hist.map((p) => p[0]));
    const w = stat("Онлайн за " + (span >= 2880 ? Math.round(span / 1440) + " дн." : Math.max(1, Math.round(span / 60)) + " год"), "пік " + k(d.peak), "", true);
    w.append(spark(d.hist)); grid.append(w);
  }
  s.append(grid);
  if (d.session != null) s.append(el("div", "hint", "Середня сесія — моя оцінка за останні " + d.session_h + " год: середній онлайн, поділений на кількість нових візитів. Точну цифру бачить лише автор гри."));
  if (d.descr) s.append(el("div", "descr", d.descr));
  const b = el("button", "btn", "Відкрити в Roblox"); b.onclick = () => openGame(g); s.append(b);
  s.classList.add("on"); $("shade").classList.add("on");
}
$("shade").onclick = closeSheet;

function render() {
  const list = $("list"); list.textContent = "";
  if (!data) return;
  const q = $("q").value.trim().toLowerCase();
  const match = (g) => !q || g.name.toLowerCase().includes(q);
  const per = data.period_h ? "за " + (data.period_h >= 22 && data.period_h <= 26 ? "24 год" : data.period_h + " год") : null;

  if (q) {  // пошук по всіх списках одразу
    const found = (data.all || []).filter(match);
    if (!found.length) { list.append(el("div", "empty", "Серед " + data.tracked + " ігор, за якими я стежу, такої нема. Щоб шукати по всьому Roblox, додай слово: напиши боту /keyword " + q)); return; }
    list.append(el("div", "note", "Знайшов " + found.length + (found.length > 80 ? ", показую перші 80" : "")));
    found.slice(0, 80).forEach((g) => list.append(gameRow(g, null)));
    return;
  }

  if (tab === "grow") {
    if (data.alerts.length) {
      list.append(el("h2", null, "Гаряче за останні 3 дні"));
      data.alerts.forEach((g) => list.append(gameRow(g, null, { hot: true, badge: g.kind === "boom" ? "ВИБУХ" : "НОВИЙ ХІТ" })));
      list.append(el("h2", null, "Ростуть найшвидше"));
    }
    if (!per) { list.append(el("div", "empty", "Ще збираю історію. Перші цифри росту будуть за годину-дві.")); return; }
    list.append(el("div", "note", "Зміна онлайну " + per + (data.period_h < 22 ? " (історія ще збирається)" : "")));
    if (!data.grow.length) list.append(el("div", "empty", "Зараз нічого помітно не росте"));
    data.grow.forEach((g, i) => list.append(gameRow(g, i, { growTab: true })));
  } else if (tab === "kw") {
    const kws = data.keywords || [];
    if (!kws.length) { list.append(el("div", "empty", "Тут будуть усі ігри з твоїми словами в назві чи описі. Додай слово: напиши боту /keyword egg")); return; }
    list.append(el("div", "note", "Ігри з пошуку Roblox за твоїми словами. Про нові пишу в чат одразу"));
    kws.forEach((kw) => {
      list.append(el("h2", null, "«" + kw.word + "» · " + kw.total + " ігор"));
      if (!kw.games.length) list.append(el("div", "empty", "Шукаю… зʼявиться за кілька хвилин"));
      kw.games.forEach((g, i) => list.append(gameRow(g, i)));
    });
  } else if (tab === "new") {
    list.append(el("div", "note", "Ігри, молодші за 30 днів, з онлайном від 1K"));
    if (!data.new.length) list.append(el("div", "empty", "Нових хітів зараз нема"));
    data.new.forEach((g, i) => list.append(gameRow(g, i)));
  } else if (tab === "top") {
    list.append(el("div", "note", "Найбільший онлайн прямо зараз"));
    data.top.forEach((g, i) => list.append(gameRow(g, i)));
  } else if (tab === "watch") {
    if (!data.watch.length) { list.append(el("div", "empty", "Список порожній. Напиши боту: /watch назва гри")); return; }
    data.watch.forEach((g) => list.append(gameRow(g, null)));
  } else if (tab === "themes") {
    list.append(el("div", "note", per ? "Сумарний онлайн теми і зміна " + per : "Сумарний онлайн теми. Зміна зʼявиться, коли зберу історію"));
    data.themes.forEach((t) => {
      const r = el("div", "row theme");
      const mid = el("div", "mid");
      mid.append(el("div", "name", t.name), el("div", "meta", t.count + " ігор у чартах"));
      const right = el("div", "right");
      right.append(el("div", "num", k(t.players)), pctEl(t.pct));
      r.append(mid, right);
      r.onclick = () => { openTheme = openTheme === t.name ? null : t.name; render(); };
      list.append(r);
      if (openTheme === t.name) {
        const kids = el("div", "kids");
        t.games.forEach((g) => kids.append(gameRow(g, null)));
        list.append(kids);
      }
    });
  }
}

function renderTabs() {
  const box = $("tabs"); box.textContent = "";
  TABS.forEach(([id, label]) => {
    const b = el("button", "tab" + (id === tab ? " on" : ""), label);
    b.onclick = () => { tab = id; try { localStorage.setItem("tab", id); } catch (e) {} $("q").value = ""; renderTabs(); render(); window.scrollTo(0, 0); };
    box.append(b);
  });
}

function renderHead() {
  if (!data) return;
  $("sub").innerHTML = "";
  const b = el("b", null, k(data.total_players));
  $("sub").append(b, document.createTextNode(" гравців · " + data.tracked + " ігор"));
  const mins = Math.max(0, Math.round((Date.now() / 1000 - data.updated) / 60));
  const upd = $("upd"); upd.textContent = "";
  upd.append(el("span", "dot" + (mins > 45 ? " old" : "")), document.createTextNode(mins < 1 ? "щойно" : mins < 60 ? mins + " хв тому" : Math.round(mins / 60) + " год тому"));
}

async function load() {
  try {
    const r = await fetch(DATA_URL + "?t=" + Math.floor(Date.now() / 120000), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
    renderHead(); render();
  } catch (e) {
    if (!data) { $("sub").textContent = "Не вдалось завантажити дані"; $("list").textContent = ""; $("list").append(el("div", "empty", "Спробуй відкрити ще раз за хвилину.")); }
  }
}

$("q").addEventListener("input", render);
if (!TABS.some(([id]) => id === tab)) tab = "grow";
renderTabs(); load();
setInterval(load, 120000); setInterval(renderHead, 30000);
</script>
</body>
</html>
